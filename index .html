  <script>
    const PROFILE_DATE = "profile";
    const PROFILE_STATUS = "profile";
    let records = [];
    let selectedEmployeeId = null;
    let editingEmployeeId = null;
    let initialized = false;

    const todayISO = new Date().toISOString().slice(0, 10);
    const dateInput = document.getElementById("attendance-date");
    const employeeList = document.getElementById("employee-list");
    const manageList = document.getElementById("manage-employee-list");
    const messageBox = document.getElementById("app-message");
    const employeeModal = document.getElementById("employee-modal");
    const employeeForm = document.getElementById("employee-form");
    const employeeNameInput = document.getElementById("employee-name");
    const saveEmployeeButton = document.getElementById("save-employee-button");

    dateInput.value = todayISO;
    document.getElementById("report-start").value = todayISO.slice(0, 8) + "01";
    document.getElementById("report-end").value = todayISO;

    function profiles() {
      return records
        .filter(item => item.attendance_date === PROFILE_DATE && item.attendance_status === PROFILE_STATUS)
        .sort((a, b) => a.employee_name.localeCompare(b.employee_name, "ar"));
    }

    function attendanceFor(employeeName, date) {
      return records.find(item =>
        item.attendance_date === date &&
        item.employee_name === employeeName &&
        item.attendance_status !== PROFILE_STATUS
      );
    }

    function statusClass(status) {
      return {
        "حضرت": "status-present",
        "لم تحضر": "status-not-present",
        "غائبة": "status-absent",
        "مكلفة": "status-assigned"
      }[status] || "bg-[#edf3f5] text-[#607783]";
    }

    function showMessage(text, kind = "success") {
      messageBox.textContent = text;
      messageBox.className = "mt-5 rounded-xl border px-4 py-3 text-center font-bold";
      if (kind === "error") {
        messageBox.classList.add("border-[#e6b9b9]", "bg-[#fff3f3]", "text-[#933d3d]");
      } else {
        messageBox.classList.add("border-[#bad9d4]", "bg-[#eef8f6]", "text-[#17624d]");
      }
      setTimeout(() => { messageBox.classList.add("hidden"); }, 4200);
    }

    function updateSummary() {
      const date = dateInput.value;
      const dayRecords = records.filter(r => r.attendance_date === date);
      document.getElementById("count-present").textContent = dayRecords.filter(r => r.attendance_status === "حضرت").length;
      document.getElementById("count-not-present").textContent = dayRecords.filter(r => r.attendance_status === "لم تحضر").length;
      document.getElementById("count-absent").textContent = dayRecords.filter(r => r.attendance_status === "غائبة").length;
      document.getElementById("count-assigned").textContent = dayRecords.filter(r => r.attendance_status === "مكلفة").length;
    }

    function renderAttendance() {
      const currentProfiles = profiles();
      const empty = document.getElementById("attendance-empty");
      [...employeeList.querySelectorAll(".employee-row")].forEach(el => el.remove());
      empty.classList.toggle("hidden", currentProfiles.length > 0);

      currentProfiles.forEach(profile => {
        const fragment = document.getElementById("employee-attendance-template").content.cloneNode(true);
        const row = fragment.querySelector(".employee-row");
        const record = attendanceFor(profile.employee_name, dateInput.value);
        const status = record ? record.attendance_status : "غير مسجل";

        row.dataset.profileId = profile.__backendId;
        row.querySelector(".employee-name").textContent = profile.employee_name;
        row.querySelector(".employee-detail").textContent = record ? "تم تسجيل الحالة لهذا التاريخ" : "لم تُسجل الحالة بعد";
        const statusElement = row.querySelector(".employee-status");
        statusElement.textContent = status;
        statusElement.className = "status-pill employee-status " + statusClass(status);

        if (selectedEmployeeId === profile.__backendId) row.classList.add("is-selected");
        row.querySelectorAll("[data-status]").forEach(button => {
          button.addEventListener("click", event => {
            event.stopPropagation();
            setAttendance(button.dataset.status, profile.__backendId);
          });
        });
        row.addEventListener("click", () => selectEmployee(profile.__backendId));
        row.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectEmployee(profile.__backendId);
          }
        });
        employeeList.appendChild(fragment);
      });
      updateSummary();
    }

    function renderManagement() {
      [...manageList.querySelectorAll(".management-row")].forEach(el => el.remove());
      const currentProfiles = profiles();
      document.getElementById("management-empty").classList.toggle("hidden", currentProfiles.length > 0);

      currentProfiles.forEach(profile => {
        const fragment = document.getElementById("employee-management-template").content.cloneNode(true);
        const row = fragment.querySelector("div");
        row.classList.add("management-row");
        row.querySelector(".management-name").textContent = profile.employee_name;
        row.querySelector(".edit-employee").addEventListener("click", () => beginEdit(profile));
        row.querySelector(".delete-employee").addEventListener("click", () => deleteEmployee(profile));
        manageList.appendChild(fragment);
      });
      lucide.createIcons();
    }

    function selectEmployee(id) {
      selectedEmployeeId = id;
      renderAttendance();
    }

    function selectedProfile() {
      return profiles().find(profile => profile.__backendId === selectedEmployeeId);
    }

    async function setAttendance(status, employeeId = selectedEmployeeId) {
      const profile = profiles().find(item => item.__backendId === employeeId);
      if (!profile) {
        showMessage("يرجى اختيار موظفة من القائمة أولاً.", "error");
        return;
      }

      const button = document.querySelector('[data-status="' + status + '"]');
      button.disabled = true;
      button.classList.add("opacity-60");
      const existing = attendanceFor(profile.employee_name, dateInput.value);
      const now = new Date().toISOString();
      let result;

      if (existing) {
        result = await window.dataSdk.update({
          ...existing,
          attendance_status: status,
          updated_at: now
        });
      } else {
        if (records.length >= 999) {
          showMessage("تم الوصول إلى الحد الأقصى للسجلات. احذفي سجلات قديمة أولاً.", "error");
          button.disabled = false;
          button.classList.remove("opacity-60");
          return;
        }
        result = await window.dataSdk.create({
          employee_name: profile.employee_name,
          attendance_date: dateInput.value,
          attendance_status: status,
          created_at: now,
          updated_at: now
        });
      }

      button.disabled = false;
      button.classList.remove("opacity-60");
      if (result.isOk) showMessage("تم حفظ حالة الحضور بنجاح.");
      else showMessage("تعذر حفظ حالة الحضور. يرجى المحاولة مرة أخرى.", "error");
    }

    function openModal() {
      employeeModal.classList.remove("hidden");
      employeeModal.classList.add("flex");
      setTimeout(() => employeeNameInput.focus(), 60);
    }

    function closeModal() {
      employeeModal.classList.add("hidden");
      employeeModal.classList.remove("flex");
      editingEmployeeId = null;
      employeeForm.reset();
    }

    function beginEdit(profile) {
      editingEmployeeId = profile.__backendId;
      employeeNameInput.value = profile.employee_name;
      saveEmployeeButton.dataset.mode = "edit";
      openModal();
    }

    async function deleteEmployee(profile) {
      const relatedRecords = records.filter(item => item.employee_name === profile.employee_name);
      const button = [...manageList.querySelectorAll(".delete-employee")].find(btn => btn.closest(".management-row")?.querySelector(".management-name")?.textContent === profile.employee_name);
      if (button) button.disabled = true;

      for (const record of relatedRecords) {
        const result = await window.dataSdk.delete(record);
        if (!result.isOk) {
          showMessage("تعذر حذف جميع سجلات الموظفة. يرجى المحاولة مرة أخرى.", "error");
          if (button) button.disabled = false;
          return;
        }
      }
      if (selectedEmployeeId === profile.__backendId) selectedEmployeeId = null;
      showMessage("تم حذف الموظفة وسجلات حضورها.");
    }

    employeeForm.addEventListener("submit", async event => {
      event.preventDefault();
      const name = employeeNameInput.value.trim();
      if (!name) return;

      saveEmployeeButton.disabled = true;
      saveEmployeeButton.classList.add("opacity-60");
      const now = new Date().toISOString();
      let result;

      if (editingEmployeeId) {
        const profile = records.find(item => item.__backendId === editingEmployeeId);
        if (!profile) {
          showMessage("تعذر العثور على الموظفة المطلوب تعديلها.", "error");
          saveEmployeeButton.disabled = false;
          saveEmployeeButton.classList.remove("opacity-60");
          return;
        }
        const duplicate = profiles().find(item => item.employee_name === name && item.__backendId !== editingEmployeeId);
        if (duplicate) {
          showMessage("هذا الاسم موجود بالفعل في القائمة.", "error");
          saveEmployeeButton.disabled = false;
          saveEmployeeButton.classList.remove("opacity-60");
          return;
        }
        result = await window.dataSdk.update({ ...profile, employee_name: name, updated_at: now });
        if (result.isOk) {
          const oldName = profile.employee_name;
          const linkedRows = records.filter(item => item.employee_name === oldName && item.__backendId !== profile.__backendId);
          for (const row of linkedRows) {
            await window.dataSdk.update({ ...row, employee_name: name, updated_at: now });
          }
          if (selectedEmployeeId === profile.__backendId) selectedEmployeeId = profile.__backendId;
        }
      } else {
        if (records.length >= 999) {
          showMessage("تم الوصول إلى الحد الأقصى للسجلات.", "error");
          saveEmployeeButton.disabled = false;
          saveEmployeeButton.classList.remove("opacity-60");
          return;
        }
        if (profiles().some(item => item.employee_name === name)) {
          showMessage("هذا الاسم موجود بالفعل في القائمة.", "error");
          saveEmployeeButton.disabled = false;
          saveEmployeeButton.classList.remove("opacity-60");
          return;
        }
        result = await window.dataSdk.create({
          employee_name: name,
          attendance_date: PROFILE_DATE,
          attendance_status: PROFILE_STATUS,
          created_at: now,
          updated_at: now
        });
      }

      saveEmployeeButton.disabled = false;
      saveEmployeeButton.classList.remove("opacity-60");
      if (result.isOk) {
        showMessage(editingEmployeeId ? "تم تعديل اسم الموظفة." : "تمت إضافة الموظفة بنجاح.");
        closeModal();
      } else {
        showMessage("تعذر حفظ بيانات الموظفة. يرجى المحاولة مرة أخرى.", "error");
      }
    });

    function csvCell(value) {
      return '"' + String(value ?? "").replace(/"/g, '""') + '"';
    }

    document.getElementById("report-form").addEventListener("submit", event => {
      event.preventDefault();
      const start = document.getElementById("report-start").value;
      const end = document.getElementById("report-end").value;
      if (!start || !end || start > end) {
        showMessage("يرجى اختيار فترة زمنية صحيحة للتقرير.", "error");
        return;
      }

      const reportRows = records
        .filter(item => item.attendance_date !== PROFILE_DATE && item.attendance_date >= start && item.attendance_date <= end)
        .sort((a, b) => a.attendance_date.localeCompare(b.attendance_date) || a.employee_name.localeCompare(b.employee_name, "ar"));

      if (!reportRows.length) {
        showMessage("لا توجد سجلات حضور ضمن الفترة المحددة.", "error");
        return;
      }

      const lines = [
        ["التاريخ", "اسم الموظفة", "حالة الحضور"],
        ...reportRows.map(row => [row.attendance_date, row.employee_name, row.attendance_status])
      ].map(row => row.map(csvCell).join(","));

      const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "تقرير-مطلع-" + start + "-الى-" + end + ".csv";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showMessage("تم تنزيل التقرير. يمكنك فتحه في Excel أو استيراده إلى Google Sheets.");
    });

    dateInput.addEventListener("change", () => {
      selectedEmployeeId = null;
      renderAttendance();
    });

    document.getElementById("today-button").addEventListener("click", () => {
      dateInput.value = todayISO;
      selectedEmployeeId = null;
      renderAttendance();
    });

    function shiftDate(days) {
      const selected = new Date(dateInput.value + "T12:00:00");
      selected.setDate(selected.getDate() + days);
      dateInput.value = selected.toISOString().slice(0, 10);
      selectedEmployeeId = null;
      renderAttendance();
    }

    document.getElementById("previous-day").addEventListener("click", () => shiftDate(-1));
    document.getElementById("next-day").addEventListener("click", () => shiftDate(1));
    document.getElementById("open-employee-modal").addEventListener("click", openModal);
    document.getElementById("close-employee-modal").addEventListener("click", closeModal);
    employeeModal.addEventListener("click", event => {
      if (event.target === employeeModal) closeModal();
    });

    document.querySelectorAll("[data-status]").forEach(button => {
      button.addEventListener("click", () => setAttendance(button.dataset.status));
    });

    const handler = {
      onDataChanged(data) {
        records = data;
        if (initialized) {
          renderAttendance();
          renderManagement();
        }
      }
    };

    async function initializeApp() {
      const result = await window.dataSdk.init(handler);
      if (!result.isOk) {
        showMessage("تعذر الاتصال بسجلات الحضور حالياً. يرجى إعادة المحاولة لاحقاً.", "error");
        return;
      }
      initialized = true;
      renderAttendance();
      renderManagement();
    }

    lucide.createIcons();
    initializeApp();
  </script>
 </body>
</html>
