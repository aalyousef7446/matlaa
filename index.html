    :root {

      --navy-deep: #102d46;
      --teal: #2f6d72;
      --gold: #c59a4a;
      --paper: #f4f6f5;
      --ink: #183148;
      --muted: #657581;
      --line: #d8e0e2;
      --success: #24755a;
      --danger: #a44949;
      --warning: #b17a27;

    * { box-sizing: border-box; }

    body {
      margin: 0;

      font-family: "Noto Sans Arabic", sans-serif;
      color: var(--ink);
    }

    button, input { font-family: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .62; }

    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(47,109,114,.32);
      outline-offset: 2px;
    }

    .app-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .app-shell::before, .app-shell::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
      opacity: .6;
    }

    .app-shell::before {
      width: 480px;
      height: 480px;
      background: #dbe6e4;
      top: -260px;
      left: -170px;
    }

    .app-shell::after {
      width: 360px;
      height: 360px;
      border: 44px solid #e8dfc9;
      bottom: -200px;
      right: -140px;
    }

    .content-frame {
      max-width: 1240px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      animation: rise-in .65s ease both;
    }

    .official-header {
      border-radius: 22px 22px 8px 8px;
      border-bottom: 4px solid var(--gold);
      box-shadow: 0 14px 34px rgba(16,45,70,.16);

    .header-inner {
      display: flex;

      justify-content: space-between;

      gap: 16px;
      min-width: 0;
    }

    .seal {
      width: 54px;
      height: 54px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.38);
      border-radius: 50%;
      color: #fff8e8;

    .eyebrow {
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .08em;
      opacity: .76;

    .today-pill {

      border-radius: 10px;
      white-space: nowrap;
      font-size: .83rem;
    }

    .control-panel {
      margin-top: 22px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 18px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(20,55,75,.07);

    .date-side, .add-side {

      align-items: end;

      height: 43px;
      border: 0;
      border-radius: 9px;

      justify-content: center;

      font-weight: 700;
      transition: transform .18s, filter .18s, box-shadow .18s;

      font-weight: 800;

    .status-button:hover:not(:disabled) { opacity: .82; transform: translateY(-1px); }
    .status-button.is-selected { opacity: 1; box-shadow: 0 0 0 2px rgba(23,59,90,.18); }
    .status-present { background: #dff2ea; color: #196248; border-color: #afdac9; }

    .status-absent { background: #f9e4e4; color: #963d3d; border-color: #e6b2b2; }
    .status-assigned { background: #ebe7f5; color: #5c4d85; border-color: #c9bfe0; }

    .row-actions, .normal-actions, .confirm-delete {
      display: flex;

      gap: 7px;
      white-space: nowrap;
    }

    .small-button {

      transition: filter .18s, transform .18s, box-shadow .18s;
    }

    .confirm-delete { display: none; }
    .delete-prompt .normal-actions { display: none; }
    .delete-prompt .confirm-delete { display: flex; }

    .empty-box {
      display: grid;
      justify-items: center;
      gap: 9px;

    }

    .empty-box svg { color: #9aadb4; width: 33px; height: 33px; }

    .export-zone {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 22px;
      border-radius: 14px;
      border-right: 4px solid var(--gold);
    }

    .export-title { margin: 0; font-weight: 800; color: var(--navy-deep); }
    .export-copy { margin: 3px 0 0; color: var(--muted); font-size: .83rem; }
    .export-buttons { display: flex; gap: 9px; flex-wrap: wrap; }
    .notice { min-height: 20px; margin: 13px 2px 0; font-size: .84rem; font-weight: 600; }
    .notice.success { color: var(--success); }
    .notice.error { color: var(--danger); }
    .notice.info { color: #49677a; }
    .footer-note { text-align: center; margin: 21px 0 0; color: #71818a; font-size: .73rem; }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }

    @media (max-width: 850px) {

      .control-panel { grid-template-columns: 1fr; }

    @media (max-width: 520px) {

      .stats-grid { grid-template-columns: 1fr 1fr; }
      .stat-card:last-child { grid-column: span 2; }
      .export-buttons { display: grid; grid-template-columns: 1fr; }
    }

  <script>
    const state = { records: [], selectedDate: "", initialized: false };
    const list = document.getElementById("attendance-list");
    const dateInput = document.getElementById("attendance-date");
    const emptyState = document.getElementById("empty-state");
    const notice = document.getElementById("notice");

    function localDateISO(date = new Date()) {
      const offset = date.getTimezoneOffset();
      return new Date(date.getTime() - offset * 60000).toISOString().slice(0, 10);
    }

    function formatArabicDate(dateString) {
      return new Intl.DateTimeFormat("ar-SA", { year: "numeric", month: "long", day: "numeric" })
        .format(new Date(dateString + "T12:00:00"));
    }

    function showNotice(message, type = "info") {
      notice.textContent = message;
      notice.className = "notice " + type;
    }

    function rosterRecords() {
      return state.records
        .filter(record => record.is_roster === true)
        .sort((a, b) => a.employee_name.localeCompare(b.employee_name, "ar"));
    }

    function attendanceFor(name) {
      return state.records.find(record =>
        record.is_roster !== true &&
        record.date === state.selectedDate &&
        record.employee_name === name
      );
    }

    function updateSummary(roster) {
      const counts = { "حضرت": 0, "لم تحضر": 0, "غائبة": 0, "مكلفة": 0 };
      roster.forEach(person => {
        const attendance = attendanceFor(person.employee_name);
        if (attendance && counts[attendance.status] !== undefined) counts[attendance.status] += 1;
      });

      document.getElementById("total-count").textContent = roster.length;
      document.getElementById("present-count").textContent = counts["حضرت"];
      document.getElementById("not-attended-count").textContent = counts["لم تحضر"];
      document.getElementById("absent-count").textContent = counts["غائبة"];
      document.getElementById("assigned-count").textContent = counts["مكلفة"];
      document.getElementById("record-count").textContent = roster.length ? `عدد الأسماء الثابتة: ${roster.length}` : "لا توجد أسماء ثابتة";
    }

    function setStatusButtons(row, status) {
      row.querySelectorAll(".status-button").forEach(button => {
        const selected = button.dataset.status === status;
        button.classList.toggle("is-selected", selected);
        button.setAttribute("aria-pressed", String(selected));
      });
    }

    async function saveStatus(person, row, status, button) {
      const existing = attendanceFor(person.employee_name);
      if (existing && existing.status === status) return;

      row.querySelectorAll(".status-button").forEach(item => item.disabled = true);
      const result = existing
        ? await window.dataSdk.update({ ...existing, status })
        : await window.dataSdk.create({
            employee_name: person.employee_name,
            date: state.selectedDate,
            status,
            is_roster: false
          });

      row.querySelectorAll(".status-button").forEach(item => item.disabled = false);

      if (result.isOk) {
        setStatusButtons(row, status);
        showNotice("تم حفظ حالة الحضور.", "success");
      } else {
        setStatusButtons(row, existing ? existing.status : "");
        showNotice("تعذر حفظ حالة الحضور، يرجى المحاولة مرة أخرى.", "error");
      }
    }

    function createRow(person, index) {
      const fragment = document.getElementById("attendance-row-template").content.cloneNode(true);
      const row = fragment.querySelector("tr");
      row.dataset.recordId = person.__backendId;
      row.querySelector(".row-number").textContent = index + 1;

      const nameInput = row.querySelector(".row-name");
      nameInput.value = person.employee_name;
      nameInput.setAttribute("aria-label", "اسم الموظفة " + (index + 1));

      const attendance = attendanceFor(person.employee_name);
      setStatusButtons(row, attendance ? attendance.status : "");

      row.querySelectorAll(".status-button").forEach(button => {
        button.setAttribute("aria-label", button.textContent + " لـ " + person.employee_name);
        button.addEventListener("click", () => saveStatus(person, row, button.dataset.status, button));
      });

      row.querySelector(".save-name-button").addEventListener("click", async function() {
        const nextName = nameInput.value.trim();
        if (!nextName) {
          showNotice("يرجى كتابة اسم الموظفة قبل الحفظ.", "error");
          nameInput.focus();
          return;
        }

        if (nextName === person.employee_name) {
          showNotice("لا توجد تعديلات على الاسم.", "info");
          return;
        }

        if (rosterRecords().some(item => item.__backendId !== person.__backendId && item.employee_name.trim() === nextName)) {
          showNotice("هذا الاسم موجود بالفعل في القائمة الثابتة.", "error");
          return;
        }

        this.disabled = true;
        const result = await window.dataSdk.update({ ...person, employee_name: nextName });
        this.disabled = false;
        showNotice(result.isOk ? "تم تعديل الاسم في القائمة الثابتة." : "تعذر تعديل الاسم، يرجى المحاولة مرة أخرى.", result.isOk ? "success" : "error");
      });

      row.querySelector(".delete-button").addEventListener("click", () => row.classList.add("delete-prompt"));
      row.querySelector(".cancel-delete-button").addEventListener("click", () => row.classList.remove("delete-prompt"));

      row.querySelector(".confirm-delete-button").addEventListener("click", async function() {
        this.disabled = true;
        const result = await window.dataSdk.delete(person);
        this.disabled = false;
        if (result.isOk) {
          showNotice("تم حذف الاسم من القائمة الثابتة. السجلات التاريخية محفوظة.", "success");
        } else {
          row.classList.remove("delete-prompt");
          showNotice("تعذر حذف الاسم، يرجى المحاولة مرة أخرى.", "error");
        }
      });

      return row;
    }

    function renderRecords() {
      const roster = rosterRecords();
      const existing = new Map([...list.children].map(row => [row.dataset.recordId, row]));
      const orderedRows = [];

      roster.forEach((person, index) => {
        let row = existing.get(person.__backendId);
        if (row) {
          existing.delete(person.__backendId);
          row.querySelector(".row-number").textContent = index + 1;
          const input = row.querySelector(".row-name");
          if (document.activeElement !== input) input.value = person.employee_name;
          const attendance = attendanceFor(person.employee_name);
          setStatusButtons(row, attendance ? attendance.status : "");
        } else {
          row = createRow(person, index);
        }
        orderedRows.push(row);
      });

      existing.forEach(row => row.remove());
      orderedRows.forEach(row => list.appendChild(row));
      emptyState.style.display = roster.length ? "none" : "grid";
      updateSummary(roster);
    }

    function setSelectedDate(date) {
      state.selectedDate = date;
      dateInput.value = date;
      renderRecords();
      showNotice(`يتم الآن عرض سجل حضور ${formatArabicDate(date)}.`, "info");
    }

    function csvEscape(value) {
      return `"${String(value ?? "").replace(/"/g, '""')}"`;
    }

    function getRange(type) {
      const base = new Date(state.selectedDate + "T12:00:00");
      let start, end, label;

      if (type === "daily") {
        start = new Date(base); end = new Date(base); label = "اليومي";
      } else if (type === "weekly") {
        start = new Date(base);
        start.setDate(start.getDate() - ((start.getDay() + 1) % 7));
        end = new Date(start);
        end.setDate(end.getDate() + 6);
        label = "الأسبوعي";
      } else {
        start = new Date(base.getFullYear(), base.getMonth(), 1);
        end = new Date(base.getFullYear(), base.getMonth() + 1, 0);
        label = "الشهري";
      }
      return { start: localDateISO(start), end: localDateISO(end), label };
    }

    function exportReport(type) {
      const range = getRange(type);
      const records = state.records
        .filter(record => record.is_roster !== true && record.date >= range.start && record.date <= range.end)
        .sort((a, b) => a.date.localeCompare(b.date) || a.employee_name.localeCompare(b.employee_name, "ar"));

      if (!records.length) {
        showNotice(`لا توجد بيانات لتصدير التقرير ${range.label} ضمن الفترة المحددة.`, "error");
        return;
      }

      const rows = [
        ["إحصائية حضور الطابور الصباحي"],
        ["نوع التقرير", range.label],
        ["الفترة", `${range.start} إلى ${range.end}`],
        [],
        ["التاريخ", "اسم الموظفة", "حالة الحضور"],
        ...records.map(record => [record.date, record.employee_name, record.status])
      ];

      const blob = new Blob(["\uFEFF" + rows.map(row => row.map(csvEscape).join(",")).join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `احصائية-الطابور-${type}-${state.selectedDate}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showNotice(`تم تحميل التقرير ${range.label} بنجاح.`, "success");
    }

    const dataHandler = {
      onDataChanged(data) {
        state.records = data;
        renderRecords();
      }
    };

    async function initialize() {
      const today = localDateISO();
      state.selectedDate = today;
      dateInput.value = today;
      document.getElementById("today-label").textContent = `تاريخ اليوم: ${formatArabicDate(today)}`;

      const result = await window.dataSdk.init(dataHandler);
      if (!result.isOk) {
        showNotice("تعذر تحميل سجلات الحضور حالياً. يرجى إعادة المحاولة لاحقاً.", "error");
        return;
      }
      state.initialized = true;
      showNotice(`جاهز لتسجيل حضور ${formatArabicDate(today)}.`, "info");
    }

    document.getElementById("add-employee-form").addEventListener("submit", async function(event) {
      event.preventDefault();
      const input = document.getElementById("employee-name");
      const button = document.getElementById("add-employee-button");
      const employeeName = input.value.trim();

      if (!employeeName) {
        showNotice("يرجى إدخال اسم الموظفة لإضافته.", "error");
        input.focus();
        return;
      }
      if (!state.initialized) {
        showNotice("يتم تجهيز السجل، يرجى الانتظار قليلاً.", "info");
        return;
      }
      if (state.records.length >= 999) {
        showNotice("تم الوصول إلى الحد الأقصى للسجلات. احذفي سجلات غير لازمة لإضافة المزيد.", "error");
        return;
      }
      if (rosterRecords().some(record => record.employee_name.trim() === employeeName)) {
        showNotice("اسم الموظفة موجود بالفعل في القائمة الثابتة.", "error");
        return;
      }

      button.disabled = true;
      const result = await window.dataSdk.create({
        employee_name: employeeName,
        date: "",
        status: "",
        is_roster: true
      });
      button.disabled = false;

      if (result.isOk) {
        input.value = "";
        showNotice("تمت إضافة الاسم إلى القائمة الثابتة وسيظهر تلقائياً كل يوم.", "success");
      } else {
        showNotice("تعذر إضافة الاسم، يرجى المحاولة مرة أخرى.", "error");
      }
    });

    dateInput.addEventListener("change", function() {
      if (this.value) setSelectedDate(this.value);
    });

    document.getElementById("today-button").addEventListener("click", function() {
      const today = localDateISO();
      setSelectedDate(today);
      document.getElementById("today-label").textContent = `تاريخ اليوم: ${formatArabicDate(today)}`;
    });

    document.getElementById("export-daily-button").addEventListener("click", () => exportReport("daily"));
    document.getElementById("export-weekly-button").addEventListener("click", () => exportReport("weekly"));
    document.getElementById("export-monthly-button").addEventListener("click", () => exportReport("monthly"));

    document.addEventListener("DOMContentLoaded", function() {
      lucide.createIcons();
      initialize();
    });
  </script>
 </body>
</html>
